services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mintbot}
      POSTGRES_USER: ${DB_USER:-mintbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-mintbot}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mintbot}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-mintbot}
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: '--max-old-space-size=256'
      WEB_URL: https://mint.${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3000'
    deploy:
      resources:
        limits:
          memory: 350M
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\'http://localhost:3000/api/v1/auth/me\').catch(()=>process.exit(0))"']
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER:-mintbot}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-mintbot}
      REDIS_URL: redis://redis:6379
      NODE_OPTIONS: '--max-old-space-size=256'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_WS_URL: https://api.${DOMAIN}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: '--max-old-space-size=256'
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'
    deploy:
      resources:
        limits:
          memory: 350M
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 100M
    networks: [internal]
    depends_on:
      - web
      - api

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
